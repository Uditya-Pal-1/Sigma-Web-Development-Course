<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeInterval&setTimeOut</title>
    <style>
        .child{
            background-color: aliceblue;
            border: 2px solid black;
            margin: 34px;
            padding: 34px;
            cursor: pointer;
        }
        .childContainer{
            background-color: beige;
            margin: 34px;
            padding: 34px;
            cursor: cell;
        }
        .container{
            background-color: rgb(255, 255, 24);
            margin: 34px;
            padding: 34px;
            cursor: progress;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="childContainer">
            <div class="child">
                I am a child
            </div>
        </div>
    </div>
    <script>
        function getRandomColor (){
            let val1 = Math.ceil(0 + Math.random() * 255);
            let val2 = Math.ceil(0 + Math.random() * 255);
            let val3 = Math.ceil(0 + Math.random() * 255);
            return `rgb(${val1},${val2},${val3})`
        }
  //      let a = setInterval(()=>{
  //          document.querySelector(".childContainer").style.background = getRandomColor();
  //      },1000)
 //      console.log(a);


        let a = setTimeout(()=>{
            document.querySelector(".childContainer").style.background = getRandomColor();
        },1000)
        console.log(a);
    </script>
</body>
</html>
